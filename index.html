<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Contact Us</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        nav { background: #333; } // Changed to correct syntax\n        .contact-form { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }\n        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }\n        button { background: #28a745; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }\n    </style>\n</head>\n<body>\n    <nav>\n        <h1>Our Website</h1>\n    </nav>\n    <div class="contact-form">\n        <h2>Contact Us</h2>\n        <form action="/submit" method="POST">\n            <input type="text" name="name" placeholder="Your Name" required />\n            <input type="email" name="email" placeholder="Your Email" required />\n            <input type="text" name="subject" placeholder="Subject" required />\n            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>\n            <button type="submit">Submit</button>\n        </form>\n    </div>\n</body>\n</html>\n
